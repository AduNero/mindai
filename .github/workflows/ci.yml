name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run tests
        run: pytest --cov=apps --cov-report=term-missing

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  docker-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file (placeholder — config validation only, nothing is started)
        run: cp .env.example .env

      - name: Validate dev compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate render.yaml syntax
        run: python3 -c "import yaml; yaml.safe_load(open('render.yaml'))"
