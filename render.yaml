# Render Blueprint for the free-tier hosting path — see
# docs/architecture/free-tier-hosting.md for the full walkthrough
# (what this deploys, its limitations vs. the Docker Compose/VPS path,
# and the manual steps still needed: Upstash Redis, the Vercel frontend,
# and filling in the `sync: false` secrets below in Render's dashboard).
#
# Deploy: connect this repo in the Render dashboard → "New Blueprint
# Instance" → it reads this file automatically.

databases:
  - name: mindcare-db
    plan: free
    databaseName: mindcare_ai
    user: mindcare_user

services:
  - type: web
    name: mindcare-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements/render.txt"
    # The free plan has no Shell access for one-off commands, so the
    # one-time setup that installation-guide.md normally has you run by
    # hand is chained in here instead. All of these are idempotent (seed
    # commands use update_or_create; bootstrap_admin no-ops without
    # DJANGO_SUPERUSER_EMAIL/PASSWORD set and otherwise updates rather
    # than erroring on an existing user) — safe to run on every deploy.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py seed_assessments &&
      python manage.py seed_recommendations &&
      python manage.py seed_emergency_resources &&
      python manage.py setup_periodic_tasks &&
      python manage.py setup_ai_periodic_tasks &&
      python manage.py bootstrap_admin &&
      gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: mindcare-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      # No DJANGO_ALLOWED_HOSTS entry needed here — Render assigns each
      # service a hostname with a random suffix that can't be predicted
      # ahead of time (e.g. mindcare-backend-m3ji.onrender.com), so
      # settings/base.py reads it directly from Render's own
      # RENDER_EXTERNAL_HOSTNAME env var (auto-injected, no setup needed).
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # No persistent background-worker process on the free tier — tasks
      # (AI analysis dispatch, chat's own analyze_content call, emails)
      # run synchronously in the request instead. See settings/base.py.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      # Off by default: real inference (Hugging Face Transformers) is too
      # heavy for the free tier's 512MB RAM running synchronously in the
      # request cycle. Sentiment/emotion analysis tasks no-op gracefully
      # when this is False — everything else works normally. Flip to
      # True (and switch requirements/render.txt to also pull in
      # requirements/ai.txt) only if you've confirmed it fits your plan's
      # memory limit.
      - key: AI_ANALYSIS_ENABLED
        value: "False"
      # Sets up your login for the deployed site — bootstrap_admin (run
      # as part of startCommand above) creates/updates this account on
      # every deploy. Fill these in, or leave blank to skip creating one.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Fill in after creating the other free accounts — see
      # docs/architecture/free-tier-hosting.md.
      - key: CHAT_LLM_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DEFAULT_CRISIS_COUNTRY
        value: GH
      # No reverse proxy in front of Django here to serve /media/ the way
      # docker/nginx/nginx.conf does for the VPS path — without this,
      # generated reports and any other uploaded/generated file 404 on
      # download. Note the free tier's filesystem is still ephemeral (see
      # Limitations in docs/architecture/free-tier-hosting.md): this
      # makes downloads work within a running instance's lifetime, it
      # doesn't make files survive a redeploy.
      - key: SERVE_MEDIA_VIA_DJANGO
        value: "True"
      # Without these, EMAIL_BACKEND falls back to Django's console
      # backend (base.py's default) — verification/password-reset emails
      # get silently printed to Render's log output instead of actually
      # being sent, which looks like registration is broken.
      #
      # Confirmed live, three separate times, that Render's free-tier
      # network has no outbound route to SMTP hosts at all — connecting
      # to smtp.gmail.com:587 fails immediately with `OSError:
      # [Errno 101] Network is unreachable`. That's a network-level
      # block on Render's side, not anything specific to Gmail, so this
      # is expected to fail the exact same way — kept as-is by explicit
      # request anyway. If it does fail identically, the working
      # options remain the HTTP-API backends in
      # apps/common/email_backends.py: ResendBackend (needs a verified
      # domain to reach real users), or SendGridBackend/BrevoBackend
      # (no domain needed, single-sender verification) — see
      # docs/architecture/free-tier-hosting.md §4.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.zoho.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
