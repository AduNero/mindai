# Serves the built React SPA. Mounted into the `frontend` (production
# target) container at /etc/nginx/conf.d/default.conf — see
# docker-compose.prod.yml. This nginx only serves static files; the main
# reverse-proxy nginx (docker/nginx/nginx.conf) sits in front of it and
# handles TLS + routing to the backend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router) — any unmatched path falls back
    # to index.html rather than a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
