# Production reverse proxy — see docs/architecture/deployment-guide.md.
#
# Replace `app.mindcare.example.com` with your real domain, and point DNS
# at this host. TLS termination assumed to happen here — mount real
# certificates and uncomment the HTTPS server block (or run this behind a
# managed load balancer that already terminates TLS and forwards plain
# HTTP here).

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name app.mindcare.example.com;

    # Uncomment once real certificates are mounted at
    # docker/nginx/certs/ (see docker-compose.prod.yml) and DNS is live —
    # left as plain HTTP by default so this config is usable as-is behind
    # a load balancer that already terminates TLS.
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/app.mindcare.example.com.crt;
    # ssl_certificate_key /etc/nginx/certs/app.mindcare.example.com.key;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Served directly from the shared volumes Django's `collectstatic`/
    # uploads write to — faster than proxying every asset through Gunicorn.
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /media/;
        expires 7d;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
