# Dev-only TLS termination in front of the backend, solely so LibreChat's
# OIDC client (which refuses non-HTTPS issuers — see docs/architecture/
# librechat-integration.md) can talk to MindCare's OIDC endpoints locally.
# Production doesn't need this: docker/nginx/nginx.conf already terminates
# real TLS end-to-end for the whole app, not just /o/.
server {
    listen 443 ssl;
    server_name oidc-proxy;

    ssl_certificate     /etc/nginx/certs/oidc-proxy.crt;
    ssl_certificate_key /etc/nginx/certs/oidc-proxy.key;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
