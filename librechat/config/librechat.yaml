# LibreChat application config — mounted into the librechat container at
# /app/librechat.yaml (see docker-compose.yml, Phase 9).
# Full reference: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.2.1
cache: true

interface:
  # Local email/password registration is intentionally disabled (see
  # librechat.env.example: ALLOW_REGISTRATION=false) — MindCare AI is the
  # only supported identity source, via OpenID SSO.
  privacyPolicy:
    externalUrl: "${DOMAIN_CLIENT}/contact"
    openNewTab: true
  termsOfService:
    externalUrl: "${DOMAIN_CLIENT}/contact"
    openNewTab: true

registration:
  socialLogins: ["openid"]

# Model endpoints. This project doesn't mandate a specific LLM provider —
# uncomment/configure whichever your deployment has API access to. At
# least one endpoint must be enabled for the chat to function.
endpoints:
  custom:
    # OpenRouter — OpenAI-API-compatible, one key gives access to many
    # providers/models. Requires OPENROUTER_KEY in librechat.env.
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["openai/gpt-4o-mini"]
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "OpenRouter"
    # NVIDIA NIM — OpenAI-API-compatible. Requires NVIDIA_API_KEY in
    # librechat.env. addParams forwards deepseek's "thinking" mode
    # (chat_template_kwargs) on every request to this endpoint.
    - name: "NVIDIA NIM"
      apiKey: "${NVIDIA_API_KEY}"
      baseURL: "https://integrate.api.nvidia.com/v1"
      models:
        default: ["deepseek-ai/deepseek-v4-flash"]
        fetch: false
      addParams:
        chat_template_kwargs:
          thinking: true
          reasoning_effort: "high"
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "NVIDIA NIM"
  # Example (OpenAI): set OPENAI_API_KEY in librechat/.env and LibreChat
  # will automatically enable its built-in OpenAI endpoint — no entry
  # needed here. Custom/self-hosted (e.g. Ollama) endpoints go under
  # `custom:` — see LibreChat's docs for the exact schema.

fileConfig:
  serverFileSizeLimit: 20
  avatarSizeLimit: 2
